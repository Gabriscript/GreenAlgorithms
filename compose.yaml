services:
  database:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-methane_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-methane_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-methane_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - methane_postgres_data:/var/lib/postgresql/data
      - ./src/backend/db/migrations/001_create_methane_incidents.sql:/docker-entrypoint-initdb.d/001_create_methane_incidents.sql:ro
      - ./src/backend/db/seeds/001_seed_methane_incidents.sql:/docker-entrypoint-initdb.d/002_seed_methane_incidents.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  methane_postgres_data:

